<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <title>03 - 金属材质</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
<a href="../../index.html" class="return-button">返回目录</a>
</body>
<!-- endregion -->
<script type="module">
import * as THREE from '../../build/three.module.js'
import { GLTFLoader } from '../../build/gltf-loader.js'

let camera, scene, renderer, model, light

init()

function init () {
  camera = new THREE.PerspectiveCamera(18, window.innerWidth / window.innerHeight, 1, 1600)
  camera.position.set(35, 20, 35)
  camera.lookAt(new THREE.Vector3(0, 0, 0))

  scene = new THREE.Scene()

  const light = new THREE.DirectionalLight(0x404040, 3)
  scene.add(light)

  const loader = new GLTFLoader()
  loader.load('../../assets/v23.glb', gltf => {
    model = gltf.scene.children[0]

    // 为模型设置金属材质
    model.children.forEach(child => {
      // standardMaterial: 参数较为直观，主要是 metalness, roughness 和 diffuse
      child.children[0].material = new THREE.MeshStandardMaterial({
        metalness: 1,
        roughness: 0.1
      })
    })

    scene.add(model)

    renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(3)
    renderer.setAnimationLoop(animation)
    document.body.appendChild(renderer.domElement)
  })
}

function animation () {
  model.rotateX(0.01)
  model.rotateY(0.01)
  renderer.render(scene, camera)
}
</script>
</html>
