<html lang="en">
<!-- region html -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../style.css">
    <title>02 - 载入模型</title>
</head>
<body>
<a href="../../index.html" class="return-button">返回目录</a>
</body>
<!-- endregion html -->
<script type="module">
import * as THREE from '../../build/three.module.js'
import {GLTFLoader} from "../../build/gltf-loader.js";

let camera, scene, renderer, model

init()

function init () {
  camera = new THREE.PerspectiveCamera(18, window.innerWidth / window.innerHeight, 1, 1600)
  camera.position.set(35, 20, 35)
  camera.lookAt(new THREE.Vector3(0, 0, 0))

  scene = new THREE.Scene()

  // 导入模型
  new GLTFLoader().load('../../assets/v23.glb', gltf => {
    model = gltf.scene.children[0]
    model.children.forEach(child =>
      child.children[0].material = new THREE.MeshNormalMaterial() // 根据C4D工程文件的结构找到模型的节点
    )

    scene.add(model)
  })

  renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.setSize(window.innerWidth, window.innerHeight)
  renderer.setAnimationLoop(animation)
  document.body.appendChild(renderer.domElement)
}

function animation () {
  model && (model.rotateX(0.01))
  model && (model.rotateY(0.01))
  renderer.render(scene, camera)
}
</script>
</html>
